services:
  - type: web
    name: nsyu-backend-api
    runtime: node
    plan: free
    region: singapore
    rootDir: api
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DIALECT
        value: postgres
      - key: DB_HOST
        value: aws-0-ap-south-1.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres.lggjtxzannywecuvwqbl
      # Secrets are NOT stored in git. Set them in the Render dashboard
      # (Service → Environment). `sync: false` keeps the dashboard value.
      - key: DB_PASS
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
