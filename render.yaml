services:
  - type: web
    name: nsyu-backend-api
    runtime: node
    plan: free
    region: singapore
    rootDir: api
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DIALECT
        value: mysql
      - key: DB_HOST
        value: srv1952.hstgr.io
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: u166803992_nsyu
      - key: DB_USER
        value: u166803992_support
      # Secrets are NOT stored in git. Set them in the Render dashboard
      # (Service → Environment). `sync: false` keeps the dashboard value.
      - key: DB_PASS
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      # Product photos + shop banners live in Supabase Storage (this disk is wiped on restart).
      - key: SUPABASE_URL
        value: https://lggjtxzannywecuvwqbl.supabase.co
      - key: SUPABASE_STORAGE_BUCKET
        value: nsyu-media
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Email goes through the Cloudflare relay (relay/) because Render free blocks SMTP ports.
      - key: EMAIL_RELAY_URL
        value: https://nsyu-email-relay.nsyu-email-relay.workers.dev/send
      - key: EMAIL_RELAY_SECRET
        value: 8fedfb27bab2081336f54f98405474fc34c59de74000c2d52c34399ede0fdc5d
