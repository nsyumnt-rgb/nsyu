<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>NSYU Commerce Platform</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: sticky storefront header over cream pages of rounded white cards; business and admin shells use a left rail beside a content column. Every colour comes from these tokens (single light look by choice). */
:root{--bg:#FAF9F6;--card:#FFFFFF;--ink:#0F172A;--em:#064E3B;--em2:#047857;--line:#E6E3DA;--beige:#F3EEE3;--blue:#E8F0FB;--mut:#64748B;--tint:#ECF6F1;--bad:#B91C1C;--warn:#B45309;--sh:0 1px 2px rgba(15,23,42,.05),0 10px 28px -14px rgba(15,23,42,.14);color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif;padding-block:0}
h1,h2,h3,h4{font-family:Manrope,Inter,sans-serif;margin:0;letter-spacing:-.01em;text-wrap:balance;color:var(--ink)}
h1{font-size:clamp(30px,4.6vw,50px);line-height:1.07;font-weight:800}
h2{font-size:clamp(20px,2.4vw,27px);font-weight:800}
h3{font-size:15px;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--em2)}
img{max-width:100%}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mut{color:var(--mut)}.sm{font-size:12px}.b{font-weight:700}.tr{text-align:right}.ctr{text-align:center}.nw{white-space:nowrap}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sp{flex:1}.col{display:flex;flex-direction:column;gap:10px}
.grid{display:grid;gap:16px}.g-p{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.ic{flex:none;vertical-align:middle}
/* demo bar */
.demo{background:var(--em);color:#d1fae5;font-size:12px}
.demo .wrap{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-block:7px}
.demo b{color:#fff;margin-right:4px}
.demo button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#ecfdf5;border-radius:99px;padding:4px 11px;font-size:12px;min-height:28px}
.demo button:hover,.demo button.on{background:#fff;color:var(--em)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:600;transition:transform .15s,box-shadow .2s,background .2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh)}
.btn:focus-visible,.in:focus-visible,.lk:focus-visible,.cat:focus-visible,.pimg-wrap:focus-visible,.nv:focus-visible,summary:focus-visible{outline:2px solid var(--em2);outline-offset:2px}
.btn.pri{background:var(--em);border-color:var(--em);color:#fff}.btn.pri:hover{background:var(--em2)}
.btn.soft{background:var(--tint);border-color:#cfe8dc;color:var(--em)}
.btn.bad{background:#fff;border-color:#f3c9c9;color:var(--bad)}
.btn.sm{min-height:32px;padding:4px 11px;font-size:12.5px;border-radius:10px}
.btn.lg{min-height:48px;padding:12px 22px;font-size:15px}
.btn.blk{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.lk{background:none;border:0;padding:6px 10px;border-radius:10px;font-weight:600;color:var(--ink)}.lk:hover{background:var(--tint);color:var(--em)}
.iconb{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;position:relative}
.iconb:hover{background:var(--tint)}
.badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--em2);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.bump{animation:bump .55s}
@keyframes bump{30%{transform:scale(1.25) rotate(-8deg)}60%{transform:scale(.95) rotate(5deg)}}
/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap;background:#EEF0F3;color:#475569}
.pill.ok{background:#D9F3E6;color:#065F46}.pill.warn{background:#FDF0CE;color:#92400E}.pill.bad{background:#FCE0E0;color:#991B1B}.pill.info{background:#DDEAFB;color:#1E40AF}.pill.beige{background:var(--beige);color:#6b5b3a}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh)}
.pad{padding:20px}.pad-s{padding:14px}
.soft-card{background:var(--beige);border-radius:18px;padding:18px}
/* header */
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(250,249,246,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--bg)}
.hd-in{display:flex;align-items:center;gap:14px;min-height:68px}
.logo{display:flex;align-items:center;gap:9px;cursor:pointer;font-family:Manrope,Inter,system-ui,sans-serif;font-weight:800;font-size:20px;color:var(--em);background:none;border:0;padding:0}
.logo i{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--em),var(--em2));color:#fff;font-style:normal}
.logo small{display:block;font:500 10px Inter,system-ui,sans-serif;letter-spacing:.14em;color:var(--mut);text-transform:uppercase;margin-top:-3px}
.hs{flex:1;max-width:440px;position:relative}.hs span{position:absolute;left:12px;top:11px;color:var(--mut)}.hs .in{padding-left:38px;border-radius:99px;background:#fff}
.hn{display:flex;gap:2px;align-items:center}
.hact{display:flex;gap:8px;align-items:center;margin-left:auto}
.mb{display:none}
.has-mega,.has-dd{position:relative}
.mega,.dd{position:absolute;top:100%;right:0;opacity:0;visibility:hidden;transform:translateY(8px);transition:.2s;z-index:50;padding:14px}
.mega{left:-120px;right:auto;width:min(620px,92vw);display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.dd{min-width:210px;display:flex;flex-direction:column;gap:2px}
.has-mega:hover .mega,.has-mega:focus-within .mega,.has-dd:hover .dd,.has-dd:focus-within .dd{opacity:1;visibility:visible;transform:none}
.mega button,.dd button{display:flex;gap:8px;align-items:center;text-align:left;border:0;background:none;border-radius:10px;padding:8px 10px;font-weight:500}
.mega button:hover,.dd button:hover{background:var(--tint);color:var(--em)}
/* page */
main.pg,.pg{animation:pg .35s ease;min-width:0}
@keyframes pg{from{opacity:0;transform:translateY(8px)}}
.page{padding-block:26px 56px;display:flex;flex-direction:column;gap:34px}
.sh{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.crumb{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:12.5px;flex-wrap:wrap}
.rv{transform:translateY(16px);transition:transform .6s ease}.rv.in{transform:none}
/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;background:linear-gradient(120deg,var(--tint),var(--beige));border-radius:28px;padding:clamp(22px,4vw,48px);overflow:hidden;border:1px solid var(--line)}
.hero p.lead{font-size:16px;color:#334155;margin-top:14px;max-width:46ch}
.stats{display:flex;gap:26px;margin-top:26px;flex-wrap:wrap}.stats b{display:block;font:800 26px Manrope,Inter,system-ui,sans-serif;color:var(--em)}.stats span{font-size:12px;color:var(--mut)}
.hero-art{position:relative;height:300px;perspective:900px}
.tilt{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out;will-change:transform}
.hero-art .tilt{position:absolute;width:46%;border-radius:20px;overflow:hidden;box-shadow:0 22px 40px -18px rgba(6,78,59,.35);border:4px solid #fff}
/* product images + cards */
.pimg{aspect-ratio:1/1;background:linear-gradient(145deg,hsl(var(--h,158) 45% 95%),hsl(var(--h,158) 38% 84%));display:grid;place-content:center;justify-items:center;gap:8px;color:hsl(var(--h,158) 55% 26%);overflow:hidden;position:relative}
.pimg svg{transition:transform .5s cubic-bezier(.2,.7,.2,1)}.pimg b{font:700 12px Manrope,Inter,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;opacity:.75;text-align:center;padding:0 8px}
.pimg img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.pc{overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.pc:hover{transform:translateY(-5px);box-shadow:0 18px 36px -16px rgba(6,78,59,.25)}
.pc:hover .pimg svg,.pc:hover .pimg img,.zoomable:hover .pimg svg{transform:scale(1.13)}
.pimg-wrap{position:relative;cursor:pointer;background:none;border:0;padding:0;display:block;width:100%;overflow:hidden}
.off{position:absolute;left:10px;top:10px;background:var(--em);color:#fff;font:700 11px Manrope,Inter,system-ui,sans-serif;border-radius:99px;padding:3px 9px}
.wish{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--mut)}
.wish.on{color:#DC2626}.wish.on svg{fill:#DC2626}
.pc-b{padding:14px;display:flex;flex-direction:column;gap:7px;flex:1}
.pc-b h3{font-size:14px;line-height:1.3;cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.price{font:800 18px Manrope}.price s{font:500 12px Inter,system-ui,sans-serif;color:var(--mut);margin-left:6px}
.spacer{flex:1}
/* categories carousel */
.mq{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding:6px 2px 14px;scroll-snap-type:none;-webkit-overflow-scrolling:touch}
.mq::-webkit-scrollbar{display:none}
.cat{flex:0 0 168px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:3px;text-align:left;transition:transform .25s,box-shadow .25s,background .25s}
.cat:hover{transform:translateY(-6px);box-shadow:0 18px 32px -16px rgba(6,78,59,.3);background:var(--tint)}
.cat-img{aspect-ratio:4/3;border-radius:12px;display:grid;place-items:center;margin-bottom:8px;overflow:hidden;background:linear-gradient(145deg,hsl(var(--h) 45% 94%),hsl(var(--h) 40% 82%));color:hsl(var(--h) 55% 26%)}
.cat-img svg{transition:transform .5s}.cat:hover .cat-img svg{transform:scale(1.25)}
.cat-big{flex:none;width:auto;padding:16px}
/* market layout */
.mk{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start}
.filt{padding:16px;position:sticky;top:84px;display:flex;flex-direction:column;gap:14px}
.filt summary{font:700 15px Manrope,Inter,system-ui,sans-serif;cursor:pointer}
.chk{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:13.5px;cursor:pointer}
.chk input{accent-color:var(--em2);width:16px;height:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 13px;font-size:13px;font-weight:600}
.chip.on{background:var(--em);color:#fff;border-color:var(--em)}
/* forms */
.in{width:100%;min-height:40px;border:1px solid #d6d3c8;border-radius:12px;padding:8px 12px;background:#fff;color:var(--ink);font:inherit}
textarea.in{min-height:84px;resize:vertical}
select.in{padding-right:8px}
.f{display:flex;flex-direction:column;gap:5px}.f>label,.lbl{font-size:12px;font-weight:600;color:#475569}
.fg{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.hint{font-size:12px;color:var(--mut)}.err{color:var(--bad);font-size:12.5px}
.sw{position:relative;width:42px;height:24px;flex:none}.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;background:#cbd5d1;border-radius:99px;transition:.2s}.sw i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--em2)}.sw input:checked+i::after{transform:translateX(18px)}.sw input:focus-visible+i{outline:2px solid var(--em2);outline-offset:2px}
.radio{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;background:#fff}
.radio.on{border-color:var(--em2);background:var(--tint)}.radio input{accent-color:var(--em2);margin-top:3px}
/* tables */
.tw{overflow-x:auto;max-width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FCFBF8}
.tbl td{padding:11px 12px;border-bottom:1px solid #F0EEE7;vertical-align:middle}
.tbl tr:hover td{background:#FCFBF8}.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.thumb{width:42px;height:42px;border-radius:10px;overflow:hidden;flex:none}.thumb .pimg{aspect-ratio:1;height:100%}.thumb .pimg b{display:none}.thumb .pimg{aspect-ratio:auto;width:100%;height:100%}
/* shells */
.bz-top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:40}
.bz-top .wrap{display:flex;align-items:center;gap:12px;min-height:62px;flex-wrap:wrap;padding-block:6px}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:26px;padding-block:22px 60px;align-items:start}
.side{position:sticky;top:78px;display:flex;flex-direction:column;gap:2px}
.side .grp{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:12px 10px 4px}
.nv{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;border:0;background:none;text-align:left;font-weight:500;color:#334155;white-space:nowrap}
.nv:hover{background:var(--tint)}.nv.on{background:var(--em);color:#fff;font-weight:600}
.nv .pill{margin-left:auto}
.stat{padding:16px;display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden}
.stat .lb{font-size:12px;color:var(--mut);display:flex;gap:6px;align-items:center}.stat .v{font:800 24px Manrope,Inter,system-ui,sans-serif;letter-spacing:-.02em}.stat .ico{position:absolute;right:12px;top:12px;color:var(--em2);opacity:.9;background:var(--tint);border-radius:10px;padding:6px;display:grid;place-items:center}
.banner{border-radius:14px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner.warn{background:#FFF6DD;border:1px solid #F4DFA2;color:#7A4A0A}.banner.bad{background:#FDECEC;border:1px solid #F5C6C6;color:#8F1D1D}.banner.ok{background:var(--tint);border:1px solid #cfe8dc;color:var(--em)}.banner.info{background:var(--blue);border:1px solid #cddcf2;color:#1E3A8A}
.acct{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
/* modal & toast */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.42);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:100;animation:fade .2s}
#confirm .ov{z-index:120}
.md{background:#fff;border-radius:22px;max-width:560px;width:100%;max-height:92vh;overflow:auto;animation:pop .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 30px 80px -20px rgba(15,23,42,.4)}
.md.wide{max-width:860px}.md.sm{max-width:420px}
.md-h{display:flex;align-items:center;gap:10px;padding:18px 22px 0}.md-b{padding:16px 22px 22px}
.md-f{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding-top:16px}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
#toasts{position:fixed;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:200;pointer-events:none;padding:0 16px}
.toast{background:var(--ink);color:#fff;border-radius:14px;padding:11px 16px;font-weight:500;box-shadow:0 14px 30px -10px rgba(0,0,0,.4);animation:pop .3s;display:flex;gap:8px;align-items:center;max-width:min(520px,100%)}
.toast.ok{background:var(--em)}.toast.bad{background:#991B1B}.toast.warn{background:#92400E}
/* skeleton & empty */
.sk{background:linear-gradient(90deg,#EFEDE6 25%,#F8F6F0 37%,#EFEDE6 63%);background-size:400% 100%;animation:sh 1.3s infinite;border-radius:12px}
@keyframes sh{from{background-position:100% 0}to{background-position:0 0}}
.empty{text-align:center;padding:44px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .eb{width:68px;height:68px;border-radius:50%;background:var(--tint);color:var(--em2);display:grid;place-items:center}
/* timeline */
.tl{position:relative;display:flex;justify-content:space-between;padding-top:6px;margin:6px 0 4px}
.tl::before{content:"";position:absolute;left:5%;right:5%;top:20px;height:3px;background:var(--line);border-radius:3px}
.tl-fill{position:absolute;left:5%;top:20px;height:3px;background:var(--em2);border-radius:3px;transform-origin:left;animation:grow 1.1s ease-out}
@keyframes grow{from{transform:scaleX(0)}}
.st{flex:1;text-align:center;position:relative;font-size:12px;color:var(--mut)}
.st i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid var(--line);margin:0 auto 6px;font-style:normal;position:relative;z-index:1;transition:.3s}
.st.done{color:var(--ink);font-weight:600}.st.done i{background:var(--em2);border-color:var(--em2);color:#fff}
.st.now i{box-shadow:0 0 0 5px rgba(4,120,87,.18)}
/* invoice */
.invoice{border:1px solid var(--line);border-radius:14px;padding:22px;background:#fff;position:relative}
.invoice .stamp{position:absolute;right:22px;top:22px;border:2px solid;border-radius:8px;padding:2px 12px;font:800 14px Manrope,Inter,system-ui,sans-serif;letter-spacing:.1em;transform:rotate(-6deg);text-transform:uppercase}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px}.kv dt{color:var(--mut)}.kv dd{margin:0;text-align:right;font-weight:600}
.big{font:800 28px Manrope,Inter,system-ui,sans-serif;letter-spacing:-.02em}
.sep{border:0;border-top:1px dashed var(--line);margin:12px 0}
/* ledger */
.dr{color:var(--bad)}.cr{color:var(--em2)}
/* chart */
.chart text{fill:var(--mut);font:11px Inter,system-ui,sans-serif}.chart .gl{stroke:var(--line)}
/* success */
.okc{width:88px;height:88px;border-radius:50%;background:var(--em2);color:#fff;display:grid;place-items:center;animation:pop .6s}
/* phone */
.stage{display:grid;grid-template-columns:minmax(0,340px) auto;gap:40px;justify-content:center;align-items:start;padding-block:28px 60px}
.phone{width:392px;max-width:100%;height:790px;border-radius:46px;background:#fff;border:9px solid #E4DFD2;box-shadow:0 40px 80px -30px rgba(15,23,42,.35);display:flex;flex-direction:column;overflow:hidden;position:relative}
.ph-st{display:flex;justify-content:space-between;padding:10px 24px 4px;font:600 12px Inter,system-ui,sans-serif;background:var(--bg)}
.ph-body{flex:1;overflow-y:auto;background:var(--bg);padding:10px 14px 16px;position:relative;overscroll-behavior:contain}
.ph-nav{display:flex;border-top:1px solid var(--line);background:#fff;padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px))}
.ph-nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mut);min-height:48px;border-radius:12px}
.ph-nav button.on{color:var(--em);font-weight:700}.ph-nav button.on svg{stroke-width:2.4}
.ph-top{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.m-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}
.m-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m-pc{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.m-pc .pimg{aspect-ratio:1.1}.m-pc .in-b{padding:9px;display:flex;flex-direction:column;gap:4px;flex:1}
.m-pc h4{font-size:12.5px;line-height:1.25;font-weight:600;font-family:Inter;min-height:32px}
.ptr{text-align:center;color:var(--mut);font-size:12px;height:0;overflow:hidden;transition:height .2s}.ptr.show{height:30px}
.spin{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:9px;font-weight:600}.seg button.on{background:var(--em);color:#fff}
.dots{display:flex;gap:6px;margin:10px 0}.dots i{height:6px;flex:1;border-radius:3px;background:var(--line)}.dots i.on{background:var(--em2)}
.footer{background:var(--em);color:#cdeedf;padding-block:34px;margin-top:20px}.footer .wrap{display:flex;gap:30px;flex-wrap:wrap;justify-content:space-between}.footer b{color:#fff}
@media (max-width:900px){
 .hero{grid-template-columns:1fr}.hero-art{height:230px}
 .mk{grid-template-columns:minmax(0,1fr)}.filt{position:static}
 .shell,.acct{grid-template-columns:minmax(0,1fr);gap:14px}
 .side{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:none}.side .grp{display:none}.nv{border:1px solid var(--line);background:#fff}
 .mb{display:grid}
 .hn{display:none;position:absolute;left:0;right:0;top:100%;background:#fff;border-bottom:1px solid var(--line);flex-direction:column;align-items:stretch;padding:10px 16px}.hn.open{display:flex}
 .mega{display:none}
 .stage{grid-template-columns:minmax(0,1fr)}
 .hs{order:5;flex-basis:100%;max-width:none}.hd-in{flex-wrap:wrap;padding-block:8px}
}
@media (max-width:520px){.phone{height:720px;border-width:6px}.md{border-radius:18px}}
.vh{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.rg{display:flex;gap:6px;flex-wrap:wrap}.rg.col{flex-direction:column;align-items:flex-start}
.rd{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:4px 11px 4px 8px;font-size:12.5px;font-weight:600;background:#fff;cursor:pointer;white-space:nowrap;min-height:30px}
.rd input{accent-color:var(--em2);margin:0;width:15px;height:15px;flex:none}
.rd:hover{background:var(--beige)}
.rd:has(input:checked){background:var(--tint);border-color:#9fd3bb;color:var(--em)}
.rd.t-warn:has(input:checked){background:#FDF0CE;border-color:#F0D58A;color:#92400E}.rd.t-bad:has(input:checked){background:#FCE0E0;border-color:#F3B8B8;color:#991B1B}.rd.t-mute:has(input:checked){background:#EEF0F3;border-color:#d6dbe2;color:#475569}
.rd:has(input:focus-visible),.chip:has(input:focus-visible){outline:2px solid var(--em2);outline-offset:2px}
.rd:has(input:disabled){opacity:.55;cursor:not-allowed}
label.chip{position:relative;cursor:pointer;display:inline-flex;align-items:center}
.chip:has(input:checked){background:var(--em);color:#fff;border-color:var(--em)}
.btn.k-edit:not(.pri){background:var(--blue);border-color:#cddcf2;color:#1E3A8A}
.btn.k-del:not(.pri){background:#fff;border-color:#f3c9c9;color:var(--bad)}.btn.k-del:not(.pri):hover{background:#FDECEC}
.btn.k-view:not(.pri){background:var(--beige);border-color:#e6dcc3;color:#4b3f25}
.acts{flex-wrap:wrap;gap:6px;min-width:150px;max-width:210px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

 return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Bar chart">${[0,.25,.5,.75,1].map(k=>`<line class="gl" x1="${L}" x2="${w-8}" y1="${10+ph*(1-k)}" y2="${10+ph*(1-k)}"/><text x="${L-6}" y="${14+ph*(1-k)}" text-anchor="end">${top*k>=1000?(top*k/1000)+'k':Math.round(top*k)}</text>`).join('')}${data.map((d,i)=>{const x=L+pw/data.length*(i+.5),bh=ph*d.v/top;return `<rect x="${x-bw/2}" y="${10+ph-bh}" width="${bw}" height="${bh}" rx="6" fill="#047857"/><text x="${x}" y="${h-8}" text-anchor="middle">${d.l}</text>${d.v?`<text x="${x}" y="${6+ph-bh}" text-anchor="middle" style="fill:#0F172A;font-weight:600">${d.v>=1000?(d.v/1000).toFixed(1)+'k':d.v}</text>`:''}`}).join('')}</svg>`}

VIEWS['o-notif']=()=>{const s=curShop(),L=S.notifs.filter(n=>n.to==='shop:'+s.id).sort((a,b)=>b.t-a.t);return `<div class="col" style="gap:16px">${pageH('Notifications',esc(s.name),L.some(n=>!n.read)?B('Mark all read','readall',{},'sm'):'')}<div class="card">${L.length?L.map(n=>`<div class="row" style="padding:14px 18px;border-bottom:1px solid #f1efe8;flex-wrap:nowrap"><span style="color:var(--em2)">${n.read?'':ic('bell',16)}</span><div class="sp"><div ${n.read?'class="mut"':'class="b"'}>${esc(n.text)}</div><div class="mut sm">${dtt(n.t)}</div></div></div>`).join(''):empty('bell','Nothing new','You will see new orders, credit requests and stock alerts here.')}</div></div>`};

 <aside class="card pad col" style="position:sticky;top:84px"><h3>Purchase order draft</h3>${Object.keys(G).length?Object.entries(G).map(([sid,ls])=>`<div><b class="sm">${esc(shopOf(sid).name)}</b>${ls.map(l=>`<div class="row sm" style="flex-wrap:nowrap"><span class="sp">${l.qty}× ${esc(l.p.name)}<div class="mut">@ ${fmt(b2bRate(l.p,l.qty))}</div></span><b>${fmt(l.qty*b2bRate(l.p,l.qty))}</b><button class="iconb" style="width:28px;height:28px" data-a="porm" data-id="${l.pid}" aria-label="Remove">${ic('x',12)}</button></div>`).join('')}</div>`).join('')+`<hr class="sep">${B('Review & submit','posubmit',{},'pri blk')}`:'<div class="mut">Add products to start a purchase order. One PO is created per seller.</div>'}</aside></div></div>`};

 Object.entries(G).forEach(([sid,items])=>{const total=sum(items,i=>i.qty*i.rate),paid=Math.min(adv,total);adv-=paid;const id='PO-'+(++PON);S.pos.unshift({id,buyer:s.id,seller:sid,t:now(),items,total,terms:d.terms,status:'Pending Approval',paid});if(paid)S.pl.push({id:uid('q'),po:id,buyer:s.id,seller:sid,t:now(),type:'Payment',amt:paid,note:'Advance'});notify('shop:'+sid,'New purchase order '+id+' from '+s.name+' for '+fmt(total)+' ('+d.terms+').')});U.po=[];closeModal();toast('Purchase order sent for seller approval');go('b-po')};
VIEWS['b-po']=()=>{const s=curShop(),tab=U.bz.potab||'buy',L=S.pos.filter(p=>tab==='buy'?p.buyer===s.id:p.seller===s.id).sort((a,b)=>b.t-a.t);
 return `<div class="col" style="gap:16px">${pageH('Purchase orders','Shop-to-shop orders with seller approval')}<div class="chips"><button class="chip ${tab==='buy'?'on':''}" data-a="potab" data-t="buy">My purchases · ${S.pos.filter(p=>p.buyer===s.id).length}</button><button class="chip ${tab==='sell'?'on':''}" data-a="potab" data-t="sell">Incoming orders · ${S.pos.filter(p=>p.seller===s.id).length}</button></div><div class="card">${L.length?tbl([['PO'],['Date'],[tab==='buy'?'Seller':'Buyer'],['Items'],['Total','num'],['Paid','num'],['Due','num'],['Terms'],['Status'],['']],L.map(p=>{const due=['Rejected','Pending Approval'].includes(p.status)?0:p.total-p.paid,cp=shopOf(tab==='buy'?p.seller:p.buyer);return tr([`<b>${p.id}</b>`,dt(p.t),esc(cp.name),p.items.map(i=>i.qty+'× '+esc(prod(i.pid).name)).join(', '),[fmt(p.total),'num'],[fmt(p.paid),'num'],[due?`<b class="dr">${fmt(due)}</b>`:fmt(0),'num'],p.terms,pill(p.status,{Received:'ok',Approved:'info',Dispatched:'info',Rejected:'bad'}[p.status]||'warn'),`<div class="row" style="flex-wrap:nowrap">${tab==='sell'&&p.status==='Pending Approval'?B('Approve','poapp',{id:p.id},'sm pri')+B('Reject','porej',{id:p.id},'sm bad'):''}${tab==='sell'&&p.status==='Approved'?B('Dispatch','podis',{id:p.id},'sm pri','truck'):''}${tab==='buy'&&p.status==='Dispatched'?B('Receive goods','porec',{id:p.id},'sm pri','box'):''}${tab==='buy'&&due>0?B('Pay','popay',{id:p.id},'sm','wallet'):''}</div>`])})):empty('list','No purchase orders','Browse the B2B marketplace to create one.',tab==='buy'?B('B2B marketplace','go',{v:'b-market'},'pri'):'')}</div></div>`};

/* ---- auto icons on every action button (edit, delete, confirm, cancel ...) ---- */
const IKMAP=[[/^(delete|remove)/i,'trash','k-del'],[/^edit/i,'edit','k-edit'],[/^(reject|cancel|close|decline|discard|unpublish)/i,'x',''],[/^back/i,'back',''],[/^(suspend|deactivate|block|move to)/i,'lock',''],[/^(add|create|invite|new|register)/i,'plus',''],[/^(view|details|storefront|preview|open|track|shops)/i,'eye','k-view'],[/^print/i,'printer',''],[/^(download|export)/i,'download',''],[/^history/i,'clock',''],[/^(adjust|switch|update status|convert)/i,'swap',''],[/^(refresh|reset|resend|reactivate|return|process return)/i,'refresh',''],[/^(sign out|logout)/i,'logout',''],[/^(login|sign in)/i,'user',''],[/^(pay|record pay|receive)/i,'wallet',''],[/^(set limit|limit)/i,'shield',''],[/^(approve|accept|confirm|save|activate|apply|update|submit|place|generate|send|continue|verify|yes|fulfil|publish|mark)/i,'check','']];
function iconify(){$$('.btn:not([data-ik])').forEach(b=>{b.dataset.ik='1';const t=b.textContent.trim();if(!t)return;const m=IKMAP.find(x=>x[0].test(t));if(!m)return;if(!b.querySelector('svg'))b.insertAdjacentHTML('afterbegin',m[1]==='back'?ic('chev',16).replace('<svg','<svg style="transform:rotate(180deg)"'):ic(m[1],16));if(m[2])b.classList.add(m[2])})}
(()=>{let raf=0;new MutationObserver(()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;iconify()})}).observe(document.body,{childList:true,subtree:true});})();
/* ============ Demo guide & boot ============ */
const GUIDE=[['Customer journey','Browse, add to cart, checkout with Pay Later.','customer','market'],['Owner accepts the order','Approve credit, stock is deducted, invoice is posted once.','owner','o-orders'],['POS counter sale','Bill a customer, part-pay, and watch the ledger.','owner','o-pos'],['Customer credit ledger','Opening, bills, payments and outstanding in order.','owner','o-ledger'],['Publish and unpublish','Toggle a product and see the storefront change.','owner','o-inv'],['B2B purchase order','Buy wholesale from Verma Distributors.','buyer','b-market'],['Super Admin approval','Approve City Digital Point, suspend a shop.','admin','a-shops'],['Mobile app','Same logic on a phone.','mobile','mobile']];

window.addEventListener('error',e=>{console.error(e.message)});
render();

<style>

<script>
(()=>{

if(!confirm('Ye bikri kharid daam se kam hai:\n'+bad.map(l=>l.p.name).join('\n')+'\n\nOwner ke taur par approve karein?'))return}}catch(e){}pb(d)};
/* barcode / Enter: add exact match or the only result */
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||!e.target.matches('[data-i=posq]'))return;const q=e.target.value.trim().toLowerCase(),s=curShop();if(!q)return;
const L=S.products.filter(p=>p.shop===s.id&&(p.barcode+'').toLowerCase()===q);const R=L.length?L:S.products.filter(p=>p.shop===s.id&&(p.name+p.sku+p.brand+p.barcode).toLowerCase().includes(q));
if(R.length===1){A.posadd({id:R[0].id});U.pos.q='';render();setTimeout(()=>{const i=document.querySelector('[data-i=posq]');i&&i.focus()},30)}else toast(R.length?'Kai item mile. Pura barcode ya naam likhein.':'Item nahi mila','warn')});
/* Hinglish labels */
const H={'POS / Create order':'Billing (POS)','Current bill':'Abhi ka bill','Customer':'Grahak','Walk-in':'Walk-in (bina naam)','Discount':'Chhoot','Subtotal':'Kul (chhoot se pehle)','Total':'Kul bill','Payment':'Bhugtaan','Paid':'Poora paid','Partial':'Aadha-aadha','Pay later':'Udhaar','Method':'Tareeka','Paid now (₹)':'Abhi diya (₹)','Generate invoice':'Bill banayein','Clear bill':'Bill saaf karein','Print':'Print','Download PDF':'PDF download','Record payment':'Paisa mila','Statement':'Statement','WhatsApp reminder':'WhatsApp yaad dilayein','Total udhaar':'Kul udhaar','Customers with udhaar':'Udhaar wale grahak','Over their limit':'Limit ke paar','Search customer name or phone':'Naam ya phone se khojein','Search by name, SKU or scan barcode':'Naam, brand ya barcode se khojein','Customers':'Grahak','Invoices':'Bill','Payments':'Bhugtaan','Add customer':'Naya grahak'};
let on=false;const keys=Object.keys(H).sort((a,b)=>b.length-a.length);
const walk=n=>{const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);let x;while(x=w.nextNode()){const t=x.nodeValue.trim();if(H[t]&&!x.parentElement.closest('#hl'))x.nodeValue=x.nodeValue.replace(t,H[t])}n.querySelectorAll&&n.querySelectorAll('input[placeholder]').forEach(i=>{if(H[i.placeholder])i.placeholder=H[i.placeholder]})};
